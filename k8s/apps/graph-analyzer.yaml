apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-analyzer
  namespace: zta-research
  labels:
    app: graph-analyzer
    component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graph-analyzer
  template:
    metadata:
      labels:
        app: graph-analyzer
        component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: graph-analyzer
      containers:
      - name: analyzer
        image: thyosurya/graph-analyzer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 2112
        env:
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: zta-admin-secret
              key: admin-token
        - name: MIN_CALLS_PER_MIN
          value: "10"
        - name: ANALYSIS_INTERVAL_S
          value: "30"
        - name: MAX_EDGES
          value: "500"
        - name: MAX_CANDIDATES
          value: "2"
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: graph-analyzer
  namespace: zta-research
  labels:
    app: graph-analyzer
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 2112
    targetPort: 2112
  selector:
    app: graph-analyzer
