apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-distributor
  namespace: zta-research
  labels:
    app: cache-distributor
    component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-distributor
  template:
    metadata:
      labels:
        app: cache-distributor
        component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cache-distributor
      containers:
      - name: distributor
        image: thyosurya/cache-distributor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: rest
          containerPort: 8081
        - name: grpc
          containerPort: 50051
        - name: metrics
          containerPort: 2112
        env:
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: zta-admin-secret
              key: admin-token
        - name: SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: zta-signing-secret
              key: signing-key
        - name: GRAPH_ANALYZER_URL
          value: "http://graph-analyzer:8080"
        - name: OPA_URL
          value: "http://opa:8181"
        - name: GRPC_PORT
          value: "50051"
        - name: REST_PORT
          value: "8081"
        - name: DISTRIBUTION_INTERVAL_S
          value: "30"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: rest
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: rest
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cache-distributor
  namespace: zta-research
  labels:
    app: cache-distributor
spec:
  ports:
  - name: rest
    port: 8081
    targetPort: 8081
  - name: grpc
    port: 50051
    targetPort: 50051
  - name: metrics
    port: 2112
    targetPort: 2112
  selector:
    app: cache-distributor
