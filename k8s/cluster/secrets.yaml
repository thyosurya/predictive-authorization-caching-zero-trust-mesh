# K8s Secrets dan ServiceAccounts untuk ZTA Research
# Dalam production, gunakan sealed-secrets atau external secrets operator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: graph-analyzer
  namespace: zta-research
  labels:
    app: graph-analyzer
    component: control-plane

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cache-distributor
  namespace: zta-research
  labels:
    app: cache-distributor
    component: control-plane

---
# Secret: Admin token untuk Graph Analyzer
apiVersion: v1
kind: Secret
metadata:
  name: zta-admin-secret
  namespace: zta-research
  labels:
    component: control-plane
type: Opaque
data:
  # base64 encode dari "research-admin-token-2024"
  admin-token: cmVzZWFyY2gtYWRtaW4tdG9rZW4tMjAyNA==

---
# Secret: Signing key untuk Cache Distributor (32 bytes base64)
apiVersion: v1
kind: Secret
metadata:
  name: zta-signing-secret
  namespace: zta-research
  labels:
    component: control-plane
type: Opaque
data:
  # base64(base64("01234567890123456789012345678901")) - matching WASM filter key
  signing-key: TURFeU16UTFOamM0T1RBeE1qTTBOVFkzT0Rrd01USXpORFUyTnpnNU1ERT0=
