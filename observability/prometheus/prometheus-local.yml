global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/custom-rules.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'graph-analyzer'
    static_configs:
      - targets: ['graph-analyzer:2112']
    metrics_path: /metrics

  - job_name: 'cache-distributor'
    static_configs:
      - targets: ['cache-distributor:2112']
    metrics_path: /metrics

  - job_name: 'service-a'
    static_configs:
      - targets: ['service-a:8080']
    metrics_path: /metrics

  - job_name: 'service-b'
    static_configs:
      - targets: ['service-b:8080']
    metrics_path: /metrics

  - job_name: 'service-c'
    static_configs:
      - targets: ['service-c:8080']
    metrics_path: /metrics
